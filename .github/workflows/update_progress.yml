name: Update Progress README

on:
  push:
    branches: [main]
    paths:
      - '**.json'
      - 'update_readme.py'
      - 'strip_image_data.py'
      - '.github/workflows/update_progress.yml'
  workflow_dispatch:

concurrency:
  group: progress-main
  cancel-in-progress: false

jobs:
  update-readme:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify annotations contain no images
        run: python strip_image_data.py --check
      - name: Generate progress
        run: python update_readme.py
      - name: Publish chart while preserving reference images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          assets_dir="$RUNNER_TEMP/progress-assets"
          if git ls-remote --exit-code --heads origin assets; then
            git fetch --depth=1 origin assets
            git worktree add --detach "$assets_dir" FETCH_HEAD
          else
            mkdir -p "$assets_dir"
            git -C "$assets_dir" init -b assets
            git -C "$assets_dir" remote add origin "$(git remote get-url origin)"
            git -C "$assets_dir" config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
          fi
          cp progress_chart.svg "$assets_dir/progress_chart.svg"
          git -C "$assets_dir" config user.name 'github-actions[bot]'
          git -C "$assets_dir" config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C "$assets_dir" add progress_chart.svg
          if ! git -C "$assets_dir" diff --cached --quiet; then
            git -C "$assets_dir" commit -m 'Update progress chart'
            git -C "$assets_dir" push origin HEAD:assets
          fi
      - name: Publish progress text
        run: |
          git add README.md progress_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Auto-update progress README'
            git push origin HEAD:main
          fi
